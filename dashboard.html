<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="股票AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>股票AI儀表板</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e5e9f0;--soft:#f1f4f8;
  --up:#dc2626;--down:#16a34a;--buy:#2563eb;--buy-bg:#dbeafe;--wait:#475569;--wait-bg:#e2e8f0;--sell:#b45309;--sell-bg:#fef3c7;
  --accent:#2563eb;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1220;--card:#131c2e;--ink:#e8edf5;--mute:#8b9ab1;--line:#243047;--soft:#1a2539;
  --up:#f87171;--down:#4ade80;--buy:#93c5fd;--buy-bg:#1e3a8a;--wait:#cbd5e1;--wait-bg:#2a3750;--sell:#fcd34d;--sell-bg:#5b3a0a;--accent:#60a5fa;--shadow:none;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{padding:0 16px calc(76px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
header{padding:calc(14px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
.sub{font-size:12px;color:var(--mute)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.icon-btn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 14px 12px;margin:10px 0}
.mkt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mkt b{font-size:22px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.buy{background:var(--buy-bg);color:var(--buy)}.pill.wait{background:var(--wait-bg);color:var(--wait)}.pill.sell{background:var(--sell-bg);color:var(--sell)}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sum div{background:var(--card);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.sum b{display:block;font-size:22px}.sum span{font-size:12px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:700;font-size:16px}.code{color:var(--mute);font-size:12px;margin-left:6px}
.price{font-size:20px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.tag{font-size:12px;background:var(--soft);color:var(--mute);padding:2px 8px;border-radius:8px}
svg.spark{width:100%;height:auto;display:block;margin-top:6px}
.detail{display:none;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.card.open .detail{display:block}
.chev{color:var(--mute);font-size:12px;text-align:center;margin-top:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:8px 0}
.kv div{background:var(--soft);border-radius:10px;padding:6px 10px}
.kv span{display:block;font-size:11px;color:var(--mute)}.kv b{font-size:15px}
h3{font-size:13px;color:var(--mute);margin:12px 0 4px;font-weight:600}
.why{font-size:14px;margin:6px 0}
ul.z{list-style:none;padding:0;margin:0;font-size:13px}ul.z li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.skeleton{height:120px;border-radius:16px;margin:10px 0;background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.msg{padding:14px;color:var(--mute);text-align:center;font-size:14px}
.err{color:var(--sell)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--mute)}nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--accent);font-weight:700}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.seg button{padding:7px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:14px;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff}
.inp{display:flex;gap:8px}
.inp input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.go{padding:0 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
.go:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{font-size:12px;background:var(--soft);color:var(--mute);padding:4px 10px;border-radius:8px}
pre.out{white-space:pre-wrap;word-break:break-word;font:14px/1.6 inherit;margin:0}
.hide{display:none!important}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:608px;margin:0 auto;background:#1e293b;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:14px}
.toast.show{display:flex}.toast button{color:#93c5fd;font-weight:700;padding:4px 8px;white-space:nowrap}
.rt{margin-top:8px;padding:8px 14px;border-radius:10px;background:var(--soft);font-size:14px}
.hs{width:100%;height:auto;display:block;margin-top:8px}
.al .r{display:flex;gap:6px}.al .r button{height:34px;padding:0 10px;border-radius:10px;background:var(--soft);font-size:13px}
.pf{padding:14px}
.pf .big{font-size:26px;font-weight:700}
.pf .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px}
.pf .g div{background:var(--soft);border-radius:10px;padding:6px 10px}
.pf .g span{display:block;font-size:11px;color:var(--mute)}.pf .g b{font-size:15px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:12px 0 6px;background:var(--soft)}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}.leg u{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;text-decoration:none}
.fab{display:block;width:100%;margin:10px 0;padding:12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);color:var(--accent);font-weight:700}
.act{display:flex;gap:8px;margin-top:12px}
.act button{flex:1;padding:9px;border-radius:10px;background:var(--soft);font-size:14px}.act .del{color:var(--sell)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font-size:17px}
.sheet label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.sheet input,.sheet select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.sheet .two{display:grid;grid-template-columns:1fr 90px;gap:8px}
.sheet .btns{display:flex;gap:8px;margin-top:16px}.sheet .btns button{flex:1;padding:12px;border-radius:12px;background:var(--soft);font-weight:600}.sheet .btns .ok{background:var(--accent);color:#fff}
.sheet .note{font-size:12px;color:var(--mute);margin-top:6px}
.al{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.al:last-child{border:0}
.al .x{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--sell)}
.kpage{position:fixed;inset:0;background:var(--bg);z-index:25;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.kpage.show{display:block}
.kwrap{max-width:640px;margin:0 auto;padding:0 16px calc(30px + env(safe-area-inset-bottom))}
.khead{position:sticky;top:0;background:var(--bg);z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 8px}
svg.kc{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.kinfo{font-size:12px;color:var(--mute);min-height:34px;line-height:1.5;font-variant-numeric:tabular-nums}
.kinfo b{color:var(--ink)}
.chp{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chp button{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);color:var(--mute)}
.chp button.on{background:var(--accent);color:#fff}
.ctl{display:flex;gap:8px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.ctl select{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.btn2{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn2 button{padding:7px 12px;border-radius:10px;background:var(--soft);font-size:13px}
.btn2 button:disabled{opacity:.5}
.sel2{display:flex;gap:8px;margin:8px 0}
.sel2 select{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.outhead{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 0}
details.stx{border-top:1px solid var(--line,#2a3550);padding:8px 0}details.stx summary{cursor:pointer;font-weight:700;font-size:14px}.concl{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.7}.h4{margin:12px 0 4px;font-size:13px}
details.how{margin:8px 0;font-size:13px;color:var(--mute)}details.how summary{cursor:pointer}details.how p{margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;color:var(--mute);font-weight:600;text-align:right;padding:4px 4px}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-top:1px solid var(--line);text-align:right}
.tbl tr[data-bt]{cursor:pointer}.tbl tr[data-bt]:active{background:var(--soft)}
svg.lc{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.leg2{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;margin:4px 0}
.hm{display:grid;gap:2px;font-size:10px;font-variant-numeric:tabular-nums;margin-top:6px}
.hm div{text-align:center;padding:6px 0;border-radius:4px}.hm .lb{color:var(--mute);background:none;font-size:10px;padding:6px 0;overflow:hidden;white-space:nowrap}
.bar2{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:3px 0}.bar2 i{display:block;height:100%;border-radius:99px}
.rk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.rk:first-child{border-top:0}
.rk .no{width:22px;color:var(--mute);font-weight:700;text-align:center;padding-top:2px}
.rk .mid{flex:1;min-width:0}.rk .rt2{text-align:right;white-space:nowrap}
.mini{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.mini button{padding:4px 10px;border-radius:8px;background:var(--soft);font-size:12px}.mini button:disabled{opacity:.5}
.donutw{display:flex;gap:12px;align-items:center}.donutw .leg2{flex-direction:column;flex:1}
</style>
</head>
<body>
<header>
  <div><h1>📊 股票AI儀表板</h1><div class="sub" id="upd">載入中…</div></div>
  <button class="icon-btn" id="refresh" aria-label="重新整理">⟳</button>
</header>

<section id="tab-watch">
  <div class="card" id="mkt"><div class="msg">大盤載入中…</div></div>
  <div id="pf"></div>
  <div id="hist"></div>
  <div class="sum" id="sum"></div>
  <div id="ctl"></div>
  <div id="list"></div>
  <button class="fab" id="add">＋ 新增自選股</button>
</section>

<section id="tab-alert" class="hide">
  <div class="card">
    <h3 style="margin-top:0">新增價格警示</h3>
    <div class="inp" style="margin-bottom:8px"><input id="acode" list="codes" placeholder="代號 2330" autocomplete="off" autocapitalize="characters"><datalist id="codes"></datalist></div>
    <div class="seg" id="atype"><button class="on" data-t="above">漲到 ≥</button><button data-t="below">跌到 ≤</button></div>
    <div class="inp"><input id="aprice" type="number" inputmode="decimal" placeholder="價格"><button class="go" id="aadd">新增</button></div>
    <div class="sub" id="amsg" style="margin-top:6px">到價會用 LINE 通知你（每天最多推播量請自行留意）</div>
  </div>
  <div class="card" id="alist"><div class="msg">載入中…</div></div>
</section>

<section id="tab-scan" class="hide">
  <div class="seg" id="sseg"><button class="on" data-s="scan">🔎 掃描</button><button data-s="inst">💰 法人熱門</button><button data-s="bot">🔻 底部觀察</button><button data-s="rev">📋 覆盤</button></div>
  <div id="scan"></div><div id="inst" class="hide"></div><div id="bot" class="hide"></div><div id="rev" class="hide"></div>
</section>

<section id="tab-tool" class="hide">
  <div class="seg" id="seg"></div>
  <div class="inp"><input id="q" autocomplete="off" autocapitalize="off" enterkeyhint="go"><button class="go" id="go">查詢</button></div>
  <div class="sel2 hide" id="btopt"><select id="bts"><option value="">策略：全部比較</option><option value="均線">均線</option><option value="RSI">RSI</option><option value="背離">背離</option><option value="MACD">MACD</option><option value="布林">布林</option><option value="突破">突破</option></select><select id="bty"><option value="1年">1 年</option><option value="3年" selected>3 年</option><option value="5年">5 年</option></select></div>
  <div class="sel2 hide" id="pfopt"><select id="pfr"><option value="">風險：預設（中等）</option><option value="保守">保守</option><option value="中等">中等</option><option value="積極">積極</option></select></div>
  <div class="chips" id="recent"></div>
  <div class="chips" id="chips"></div>
  <div id="outbox"></div>
</section>

<div class="kpage" id="kpage"><div class="kwrap">
  <div class="khead"><button class="icon-btn" id="kclose" aria-label="返回">←</button><div id="ktitle" style="flex:1;min-width:0"></div><button class="icon-btn" id="kref" aria-label="更新">⟳</button></div>
  <div id="kbody"></div>
</div></div>

<div class="toast" id="toast"><span id="tmsg"></span><button id="tact"></button></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<nav>
  <button class="on" data-t="watch"><b>⭐</b>自選股</button>
  <button data-t="alert"><b>🔔</b>警示</button>
  <button data-t="scan"><b>🔎</b>機會</button>
  <button data-t="tool"><b>🧰</b>工具</button>
</nav>

<script>
(function(){
let K = '';
try {
  const u = new URL(location.href), kk = u.searchParams.get('k');
  if (kk) { try { localStorage.setItem('dashk', kk); } catch (e) {} K = kk; u.searchParams.delete('k'); history.replaceState(null, '', u.pathname + (u.search || '') + u.hash); }
  else { try { K = localStorage.getItem('dashk') || ''; } catch (e) {} }
} catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n, d) => n == null ? '—' : Number(n).toLocaleString('en-US', {maximumFractionDigits: d == null ? 2 : d});
const pc = n => n == null ? '—' : (n > 0 ? '+' : '') + n.toFixed(2) + '%';
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
const vcls = v => v === '買進' ? 'buy' : v === '賣出' ? 'sell' : 'wait';
const vlab = v => v === '賣出' ? '偏弱' : v; // 賣出訊號歷史檢驗沒有明顯預測力，顯示改「偏弱」
const v2tag = v => v ? '<span class="tag" title="' + esc((v.reasons || []).join('、')) + '">' + v.emoji + ' 評分v2 ' + (v.score > 0 ? '+' : '') + fmt(v.score, 1) + '</span>' : '';
const vico = v => v === '買進' ? '🟢' : v === '賣出' ? '🔴' : '⚪';

const WRITE = /^(watch\/|alerts\/(add|del|clean|rearm|clearfired)|history\/snap)/;
async function api(path, params, timeout, _try) {
  const u = new URL('/api/dash/' + path, location.origin);
  u.searchParams.set('k', K);
  Object.entries(params || {}).forEach(([a, b]) => u.searchParams.set(a, b));
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeout || 90000);
  try {
    const r = await fetch(u, {signal: ctl.signal});
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { askKey(); throw new Error('密碼錯誤'); }
    if (!r.ok) { const er = new Error(j.error || ('HTTP ' + r.status)); er.retry = r.status >= 502; throw er; }
    return j;
  } catch (e) {
    const net = e.retry || e.name === 'TypeError';
    if (net && !_try && !WRITE.test(path)) { clearTimeout(tm); await new Promise(r => setTimeout(r, 3000)); return api(path, params, timeout, 1); }
    throw new Error(e.name === 'AbortError' ? '逾時（伺服器可能剛喚醒，稍後再按重新整理）' : e.name === 'TypeError' ? '連不上伺服器（網路或剛喚醒），稍後再試' : e.message);
  }
  finally { clearTimeout(tm); }
}
function askKey() {
  openSheet('<h2>輸入儀表板密碼</h2><label>密碼（就是 Render 的 DASH_KEY）</label><input id="kk" type="password" autocomplete="current-password"><div class="note">只會存在這支手機的瀏覽器。</div><div class="btns"><button class="ok" id="kok">進入</button></div>');
  $('ov').onclick = null;
  const go = () => { const v = $('kk').value.trim(); if (!v) return; try { localStorage.setItem('dashk', v); } catch (e) {} K = v; location.reload(); };
  $('kok').onclick = go; $('kk').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}
let toastT = null;
function toast(msg, label, fn, ms) {
  $('tmsg').textContent = msg; const b = $('tact'); b.textContent = label || ''; b.style.display = label ? '' : 'none';
  b.onclick = () => { $('toast').classList.remove('show'); clearTimeout(toastT); if (fn) fn(); };
  $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('show'), ms || 8000);
}

// ───────── 迷你走勢圖（收盤＋MA20/MA60＋支撐壓力虛線）─────────
function spark(d, als) {
  const c = d.series.c, n = c.length; if (n < 5) return '';
  const W = 320, H = 110, pad = 4;
  const lv = [];
  (d.res || []).slice(0, 1).forEach(z => lv.push({v: z.mid, c: 'var(--up)'}));
  (d.sup || []).slice(0, 1).forEach(z => lv.push({v: z.mid, c: 'var(--down)'}));
  if (d.plan) { lv.push({v: d.plan.stop, c: 'var(--sell)'}); }
  (als || []).forEach(a => lv.push({v: a.target, c: 'var(--accent)', al: 1}));
  let all = c.concat(d.series.ma20.filter(x => x != null), d.series.ma60.filter(x => x != null));
  const lo0 = Math.min.apply(null, all), hi0 = Math.max.apply(null, all);
  const keep = lv.filter(l => l.v >= lo0 * 0.9 && l.v <= hi0 * 1.1);
  all = all.concat(keep.map(l => l.v));

  const X = i => pad + i * (W - 2 * pad) / (n - 1), Y = v => H - pad - (v - lo) / rg * (H - 2 * pad);

async function loadHist() {

    } else {

      const X = i => p + i * (W - 2 * p) / (rows.length - 1), Y = x => H - p - (x - lo) / rg * (H - 2 * p);

      const chg = last.mv - first.mv;
      h += '<svg class="hs" viewBox="0 0 ' + W + ' ' + H + '"><path d="' + d + ' L' + X(v.length - 1).toFixed(1) + ' ' + (H - p) + ' L' + p + ' ' + (H - p) + 'Z" fill="var(--accent)" opacity=".1"/><path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg>' +

        '<div class="kv"><div><span>期間市值變化（含加減碼）</span><b class="num ' + cls(chg) + '">' + (chg > 0 ? '+' : '') + fmt(chg, 0) + '</b></div><div><span>目前總損益</span><b class="num ' + cls(pl) + '">' + (pl == null ? '—' : (pl > 0 ? '+' : '') + fmt(pl, 0) + '（' + pc(plp) + '）') + '</b></div></div>';

function lineChart(id, series, dates, o) {
  o = o || {};
  const W = 360, H = o.h || 170, X0 = 4, PW = 312, PT = 8, PH = H - 24, n = dates.length;
  let lo = Infinity, hi = -Infinity; series.forEach(s => s.vals.forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  const pad = (hi - lo) * .06 || .01; lo -= pad; hi += pad;
  const X = i => X0 + i * PW / Math.max(1, n - 1), Y = v => PT + (hi - v) / (hi - lo) * PH;
  let s = '<svg class="lc" id="' + id + '" viewBox="0 0 ' + W + ' ' + H + '">';
  for (let g = 0; g <= 3; g++) { const v = lo + (hi - lo) * g / 3, y = Y(v); s += '<line x1="0" x2="' + (X0 + PW) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width=".6"/><text x="' + (X0 + 2) + '" y="' + (y - 2).toFixed(1) + '" font-size="8.5" fill="var(--mute)" opacity=".85">' + ((v - 1) * 100).toFixed(0) + '%</text>'; }
  if (1 > lo && 1 < hi) s += '<line x1="0" x2="' + (X0 + PW) + '" y1="' + Y(1).toFixed(1) + '" y2="' + Y(1).toFixed(1) + '" stroke="var(--mute)" stroke-width=".8" stroke-dasharray="3 3" opacity=".6"/>';
  series.forEach(sr => {
    let p = ''; sr.vals.forEach((v, i) => { if (v != null) p += (p ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
    s += '<path d="' + p + '" fill="none" stroke="' + sr.color + '" stroke-width="' + (sr.w || 1.6) + '" stroke-linejoin="round"' + (sr.dash ? ' stroke-dasharray="' + sr.dash + '"' : '') + '/>';
  });
  [0, 0.33, 0.66, 1].forEach(r => { const i = Math.round((n - 1) * r); s += '<text x="' + Math.min(X0 + PW - 28, Math.max(X0, X(i) - 14)).toFixed(1) + '" y="' + (H - 4) + '" font-size="8.5" fill="var(--mute)">' + esc(String(dates[i]).slice(2, 10)) + '</text>'; });
  s += '<line id="' + id + 'x" x1="0" x2="0" y1="' + PT + '" y2="' + (PT + PH) + '" stroke="var(--mute)" stroke-width=".7" opacity="0"/><rect x="0" y="0" width="' + (X0 + PW) + '" height="' + H + '" fill="transparent"/></svg>' +
    '<div class="sub" id="' + id + 'i" style="min-height:20px;font-variant-numeric:tabular-nums">按住圖上任一點看當天數值</div>' +
    '<div class="leg2">' + series.map(sr => '<span style="color:' + sr.color + '">— ' + esc(sr.name) + ' <b>' + rel(sr.vals[n - 1]) + '</b></span>').join('') + '</div>';
  chartReg.push({id, series, dates, X0, PW, n});
  return s;
}
function bindCharts() {
  chartReg.forEach(c => {
    const svg = $(c.id), info = $(c.id + 'i'), kx = $(c.id + 'x'); if (!svg) return;
    const mv = ev => {
      const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * 360;
      const i = Math.max(0, Math.min(c.n - 1, Math.round((x - c.X0) / c.PW * (c.n - 1))));
      const xx = c.X0 + i * c.PW / Math.max(1, c.n - 1); kx.setAttribute('x1', xx); kx.setAttribute('x2', xx); kx.setAttribute('opacity', '.7');
      info.innerHTML = '<b>' + esc(c.dates[i]) + '</b>　' + c.series.map(s => '<span style="color:' + s.color + '">' + esc(s.name) + ' ' + rel(s.vals[i]) + '</span>').join('　');
    };
    svg.addEventListener('pointermove', mv); svg.addEventListener('pointerdown', mv);
  });
  chartReg = [];
}
const pctS = (v, d) => v == null ? '—' : (v > 0 ? '+' : '') + (v * 100).toFixed(d == null ? 1 : d) + '%';

// ───────── 回測圖表 ─────────
function tradeChart(d, s) {
  const p = d.price, n = p.length, W = 360, H = 170, X0 = 4, PW = 312, PT = 8, PH = 146;
  const lo0 = Math.min.apply(null, p), hi0 = Math.max.apply(null, p), pad = (hi0 - lo0) * .06 || 1, lo = lo0 - pad, hi = hi0 + pad;
  const X = i => X0 + i * PW / (n - 1), Y = v => PT + (hi - v) / (hi - lo) * PH;
  let sv = '<svg class="lc" viewBox="0 0 ' + W + ' ' + H + '">';
  for (let g = 0; g <= 3; g++) { const v = lo + (hi - lo) * g / 3, y = Y(v); sv += '<line x1="0" x2="' + (X0 + PW) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width=".6"/><text x="' + (X0 + 2) + '" y="' + (y - 2).toFixed(1) + '" font-size="8.5" fill="var(--mute)" opacity=".85">' + fmt(v) + '</text>'; }
  sv += '<path d="' + p.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') + '" fill="none" stroke="#94a3b8" stroke-width="1.2"/>';
  s.trades.forEach(t => {
    const c = t.ret >= 0 ? 'var(--up)' : 'var(--down)', i0 = Math.max(0, t.i0), i1 = Math.min(n - 1, t.i1);
    let seg = ''; for (let i = i0; i <= i1; i++) seg += (seg ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[i]).toFixed(1);
    sv += '<path d="' + seg + '" fill="none" stroke="' + c + '" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<polygon points="' + X(i0).toFixed(1) + ',' + (Y(p[i0]) + 3).toFixed(1) + ' ' + (X(i0) - 3.5).toFixed(1) + ',' + (Y(p[i0]) + 10).toFixed(1) + ' ' + (X(i0) + 3.5).toFixed(1) + ',' + (Y(p[i0]) + 10).toFixed(1) + '" fill="var(--accent)"/>' +
      '<circle cx="' + X(i1).toFixed(1) + '" cy="' + Y(p[i1]).toFixed(1) + '" r="3" fill="' + c + '" stroke="var(--card)" stroke-width="1"/>';
  });
  [0, 0.33, 0.66, 1].forEach(r => { const i = Math.round((n - 1) * r); sv += '<text x="' + Math.min(X0 + PW - 28, Math.max(X0, X(i) - 14)).toFixed(1) + '" y="' + (H - 4) + '" font-size="8.5" fill="var(--mute)">' + esc(String(d.dates[i]).slice(2, 10)) + '</text>'; });
  return sv + '</svg><div class="sub">▲ 藍＝進場　● 紅＝賺錢出場　● 綠＝賠錢出場（紅漲綠跌）</div>';
}
function renderBT(d) {
  const S = d.strats;
  let h = '<div class="card"><div class="row"><b>' + esc(d.name || d.code) + ' <span class="code">' + esc(d.code) + '</span></b><span class="sub">近 ' + d.years + ' 年</span></div><div class="sub">' + esc(d.span) + '｜' + esc(d.costTxt) + '</div>' +
    '<h3>資金曲線（起點 = 0%）</h3>';
  const series = [{name: '買進持有', color: '#94a3b8', vals: d.bh.curve, w: 1.4, dash: '4 3'}].concat(S.map((s, i) => ({name: s.name, color: SCOL[i % 6], vals: s.curve, w: S.length > 1 ? 1.3 : 2})));
  h += lineChart('bt1', series, d.dates, {h: 180});
  if (!d.single) {
    const sc = s => s.st.total / Math.max(.05, -s.st.mdd), best = S.filter(s => s.st.n >= 5).sort((a, b) => sc(b) - sc(a))[0];
    h += '<h3>各策略比較（點一列看買賣點）</h3><table class="tbl"><tr><th>策略</th><th>筆數</th><th>勝率</th><th>PF</th><th>最大回撤</th><th>總報酬</th></tr>' +
      S.map(s => '<tr data-bt="' + esc(d.code + ' ' + STRAT_SHORT[s.key] + ' ' + $('bty').value) + '"><td>' + (best && best.key === s.key ? '🏆 ' : '') + esc(s.name) + '</td><td>' + s.st.n + '</td><td>' + (s.st.winRate == null ? '—' : (s.st.winRate * 100).toFixed(0) + '%') + '</td><td>' + (s.st.pf == null ? '—' : s.st.pf >= 999 ? '∞' : s.st.pf.toFixed(2)) + '</td><td class="down">' + pctS(s.st.mdd, 0) + '</td><td class="' + cls(s.st.total) + '">' + pctS(s.st.total, 0) + '</td></tr>').join('') +
      '<tr><td>買進持有</td><td>—</td><td>—</td><td>—</td><td class="down">' + pctS(d.bh.mdd, 0) + '</td><td class="' + cls(d.bh.total) + '">' + pctS(d.bh.total, 0) + '</td></tr></table>' +
      '<div class="sub" style="margin-top:6px">🏆＝交易 ≥5 筆中「報酬／回撤」最佳。歷史績效不代表未來，單一標的容易過度配適。</div>';
  } else {
    const s = S[0], st = s.st;
    h += '<div class="sub" style="margin-top:4px">規則：' + esc(s.rule) + '（訊號收盤確認、隔日開盤成交）</div>';
    h += '<div class="kv"><div><span>交易筆數</span><b class="num">' + st.n + '</b></div><div><span>勝率</span><b class="num">' + (st.winRate == null ? '—' : (st.winRate * 100).toFixed(0) + '%（' + st.wins + '/' + st.n + '）') + '</b></div>' +
      '<div><span>獲利因子 PF</span><b class="num">' + (st.pf == null ? '—' : st.pf >= 999 ? '∞' : st.pf.toFixed(2)) + '</b></div><div><span>平均每筆</span><b class="num ' + cls(st.avgRet) + '">' + pctS(st.avgRet, 2) + '</b></div>' +
      '<div><span>最大回撤</span><b class="num down">' + pctS(st.mdd, 1) + '</b></div><div><span>策略總報酬</span><b class="num ' + cls(st.total) + '">' + pctS(st.total, 1) + '</b></div>' +
      '<div><span>買進持有</span><b class="num ' + cls(d.bh.total) + '">' + pctS(d.bh.total, 1) + '（回撤 ' + pctS(d.bh.mdd, 0) + '）</b></div><div><span>平均持有／在場</span><b class="num">' + (st.avgBars || '—') + ' 天／' + (st.exposure == null ? '—' : (st.exposure * 100).toFixed(0) + '%') + '</b></div></div>';
    if (s.trades.length) {
      h += '<h3>買賣點</h3>' + tradeChart(d, s) + '<h3>最近交易</h3><table class="tbl"><tr><th>進場</th><th>出場</th><th>天數</th><th>報酬</th></tr>' +
        s.trades.slice(-12).reverse().map(t => '<tr><td>' + esc(String(d.dates[t.i0]).slice(2)) + '</td><td>' + esc(String(d.dates[Math.min(t.i1, d.dates.length - 1)]).slice(2)) + '</td><td>' + (t.i1 - t.i0) + '</td><td class="' + cls(t.ret) + '">' + pctS(t.ret, 1) + '</td></tr>').join('') + '</table>';
    } else h += '<div class="msg">期間內沒有交易訊號，換個期間或策略試試。</div>';
    h += '<div class="btn2"><button data-bt="' + esc(d.code + ' ' + $('bty').value) + '">← 回到全部策略比較</button></div>';
  }
  return h + '</div>';
}

// ───────── 組合診斷圖表 ─────────
function donut(parts) {
  const R = 42, C = 2 * Math.PI * R; let off = 0;
  let s = '<svg viewBox="0 0 120 120" width="140" height="140" style="transform:rotate(-90deg);flex:none">';
  parts.forEach(p => { const len = Math.max(0, p.v) * C; s += '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="' + p.color + '" stroke-width="22" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"/>'; off += len; });
  return s + '</svg>';
}
function renderPF(d) {
  const it = d.items, k = it.length;
  const parts = it.map((x, i) => ({v: x.w, color: COLORS[i % COLORS.length], t: (x.name || x.code) + ' ' + (x.w * 100).toFixed(0) + '%'}));
  if (d.cash > 0.001) parts.push({v: d.cash, color: '#cbd5e1', t: '現金 ' + (d.cash * 100).toFixed(0) + '%'});
  let h = '<div class="card"><div class="row"><b>組合診斷</b><span class="sub">風險承受度：' + esc(d.risk) + '</span></div>' +
    '<div class="donutw">' + donut(parts) + '<div class="leg2">' + parts.map(p => '<span><u style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:' + p.color + '"></u>' + esc(p.t) + '</span>').join('') + '</div></div>' +
    '<div class="kv"><div><span>年化波動</span><b class="num">' + (d.sigma * 100).toFixed(1) + '%</b></div><div><span>近1年最大回撤</span><b class="num down">' + pctS(d.mdd, 1) + '</b></div>' +
    '<div><span>最差20日</span><b class="num down">' + pctS(d.worst20, 1) + '</b></div><div><span>Beta（相對加權）</span><b class="num">' + (d.betaP == null ? '—' : d.betaP.toFixed(2)) + '</b></div>' +
    '<div><span>有效持股數</span><b class="num">' + d.effN + '</b></div><div><span>持股檔數</span><b class="num">' + k + '</b></div></div>';
  // 產業
  h += '<h3>產業集中度</h3>' + d.secW.map((x, i) => '<div class="row"><span class="sub">' + esc(x.sector) + '</span><span class="sub num">' + (x.w * 100).toFixed(0) + '%</span></div><div class="bar2"><i style="width:' + Math.min(100, x.w * 100).toFixed(1) + '%;background:' + COLORS[i % COLORS.length] + '"></i></div>').join('');
  // 風險貢獻
  const mx = Math.max.apply(null, it.map(x => Math.max(x.w, x.rc)));
  h += '<h3>資金占比 vs 風險貢獻</h3>' + it.map(x => '<div class="row"><span class="sub">' + esc(x.name || x.code) + '</span><span class="sub num">' + (x.w * 100).toFixed(0) + '% → 風險 ' + (x.rc * 100).toFixed(0) + '%' + (x.rc - x.w > .1 ? ' ⚠️' : '') + '</span></div>' +
    '<div class="bar2" style="margin-bottom:0"><i style="width:' + (x.w / mx * 100).toFixed(1) + '%;background:var(--accent)"></i></div><div class="bar2"><i style="width:' + (Math.max(0, x.rc) / mx * 100).toFixed(1) + '%;background:#f59e0b"></i></div>').join('') +
    '<div class="sub">藍＝資金占比、橘＝風險貢獻；橘明顯比藍長，代表那檔的波動大到「吃掉」更多風險額度。</div>';
  // 相關性
  h += '<h3>相關性熱力圖（近1年日報酬）</h3><div class="hm" style="grid-template-columns:44px repeat(' + k + ',1fr)"><div class="lb"></div>' + it.map(x => '<div class="lb">' + esc(x.code) + '</div>').join('');
  d.corr.forEach((row, i) => { h += '<div class="lb">' + esc(it[i].code) + '</div>' + row.map((c, j) => { const a = Math.abs(c) * .85, bg = i === j ? 'var(--soft)' : c >= 0 ? 'rgba(220,38,38,' + a.toFixed(2) + ')' : 'rgba(37,99,235,' + a.toFixed(2) + ')'; return '<div style="background:' + bg + '">' + (i === j ? '—' : c.toFixed(2)) + '</div>'; }).join(''); });
  h += '</div><div class="sub">越紅越「同漲同跌」（分散效果差），藍＝反向。</div>';
  // 壓力測試
  h += '<h3>下跌壓力測試</h3><table class="tbl"><tr><th>情境</th><th>組合損益</th>' + (d.capital ? '<th>約損失金額</th>' : '') + '</tr>' +
    d.stress.map(x => '<tr><td>' + esc(x.label) + '<div class="sub">' + esc(x.note) + '</div></td><td class="' + cls(x.pct) + '">' + pctS(x.pct, 1) + '</td>' + (d.capital ? '<td class="' + cls(x.pct) + '">' + fmt(d.capital * x.pct, 0) + ' 元</td>' : '') + '</tr>').join('') + '</table>' +
    '<div class="sub" style="margin-top:6px">大盤情境以 Beta 推算，是粗估；實際下跌時相關性會升高，損失常比估計更大。</div>';
  // 曲線
  const ser = [{name: '你的組合', color: 'var(--accent)', vals: d.curve, w: 2}]; if (d.mcurve) ser.push({name: '加權指數', color: '#94a3b8', vals: d.mcurve, w: 1.3, dash: '4 3'});
  h += '<h3>近1年走勢（依目前比例回推，起點 = 0%）</h3>' + lineChart('pf1', ser, d.dates, {h: 170});
  return h + '</div>';
}

function drawRecent() { $('recent').innerHTML = recents().map(e => '<button data-e="' + esc(e) + '" style="font-size:12px;background:var(--card);box-shadow:var(--shadow);color:var(--mute);padding:4px 10px;border-radius:8px">🕘 ' + esc(e) + '</button>').join(''); }

// ───────── 分頁／重新整理 ─────────
let tab = 'watch';
document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['watch', 'alert', 'scan', 'tool'].forEach(t => $('tab-' + t).classList.toggle('hide', t !== tab));
  if (tab === 'scan') { if (sub === 'scan') { if (!scanLoaded) loadScan(false); else renderScan(); } }
  if (tab === 'alert') loadAlerts();
  if (tab === 'watch' && dirty) loadWatch(false, true);
  scrollTo(0, 0);
});
$('refresh').addEventListener('click', () => { if (tab === 'watch') loadWatch(true); else if (tab === 'scan') { if (sub === 'inst') loadInst(true); else if (sub === 'bot') loadBot(true); else if (sub === 'rev') loadRev(true); else loadScan(true); } else if (tab === 'alert') loadAlerts(); });
// 盤中自動更新（平日 9:00–13:40，每 3 分鐘；切回頁面若超過 5 分鐘也更新）
function inMarket() { const t = new Date(Date.now() + (new Date().getTimezoneOffset() + 480) * 60000); const m = t.getHours() * 60 + t.getMinutes(); return t.getDay() > 0 && t.getDay() < 6 && m >= 540 && m <= 820; }
setInterval(() => { if (document.visibilityState === 'visible' && tab === 'watch' && inMarket() && !loading) loadWatch(false, true); }, 180000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && tab === 'watch' && !loading && Date.now() - lastLoad > 300000) loadWatch(false, true); });
drawTool();
if (!K) askKey(); else { loadWatch(false); }
})();
</script>
